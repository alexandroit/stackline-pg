name: Stackline PostgreSQL release gates

on:
  push:
    branches: [main]
    tags: ['stackline-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-pool:
    name: pg-pool / Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '16', postgres: '18' }
          - { node: '18', postgres: '18' }
          - { node: '20', postgres: '18' }
          - { node: '22', postgres: '18' }
          - { node: '24', postgres: '18' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: stackline_pg_test
          POSTGRES_PASSWORD: stackline_pg_test
          POSTGRES_DB: stackline_pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: stackline_pg_test
      PGPASSWORD: stackline_pg_test
      PGDATABASE: stackline_pg_test
      TEST_SKIP_NATIVE: 'true'
      NO_UPDATE_NOTIFIER: '1'
    defaults:
      run:
        working-directory: packages/pg-pool
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify clean source install
        run: |
          npm install --ignore-scripts --workspaces=false
          npm ls --all
          npm audit --audit-level=low
      - name: Install PostgreSQL test fixture
        run: npm install --no-save --package-lock=false --ignore-scripts --workspaces=false pg@8.23.0
      - name: Run upstream and Stackline contracts
        run: npm test
      - name: Verify package metadata
        run: npm run check:package
      - name: Verify packed consumers
        run: npm run test:smoke
      - name: Inspect packed inventory
        run: npm run pack:check
      - name: Lint the exact tarball
        if: matrix.node == '24'
        run: |
          archive=$(npm pack --silent --ignore-scripts)
          npx --yes publint@0.3.24 "$archive" --strict

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
