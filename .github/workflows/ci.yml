name: Release gates

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '16', postgres: '18' }
          - { node: '18', postgres: '18' }
          - { node: '20', postgres: '18' }
          - { node: '22', postgres: '18' }
          - { node: '24', postgres: '18' }
          - { node: '26', postgres: '18' }
          - { node: '26', postgres: '13' }
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:${{ matrix.postgres }}
        env:
          POSTGRES_USER: stackline_pg_test
          POSTGRES_PASSWORD: stackline_pg_test
          POSTGRES_DB: stackline_pg_test
          POSTGRES_HOST_AUTH_METHOD: md5
          PGDATA: /var/lib/postgresql/data
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: stackline_pg_test
      PGPASSWORD: stackline_pg_test
      PGDATABASE: stackline_pg_test
      PGTESTNOSSL: 'true'
      TEST_SKIP_NATIVE: 'true'
      NO_UPDATE_NOTIFIER: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify clean source install
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-install.log
          if grep -Eiq 'npm[[:space:]]+(warn|error)|deprecated' /tmp/npm-install.log; then
            echo 'npm install emitted a warning, error, or deprecation notice'
            exit 1
          fi
          npm ls --all
          npm audit --audit-level=low
      - name: Run all tests
        run: npm test
      - name: Verify package metadata
        run: npm run check:package
      - name: Verify packed consumers
        run: npm run test:smoke
      - name: Inspect packed inventory
        run: npm run pack:check
      - name: Lint the exact tarball
        if: matrix.node == '26' && matrix.postgres == '18'
        shell: bash
        run: |
          archive=$(npm pack --silent --ignore-scripts)
          npx --yes publint@0.3.24 "$archive" --strict

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  package:
    name: Canonical tested package
    needs: [test, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: node --test scripts/registry-requests.test.mjs
      - name: Pack the exact tested package
        run: mkdir artifact && npm pack --ignore-scripts --pack-destination artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 90
